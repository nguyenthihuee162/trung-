<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trung Thu ấm áp bình an</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== TÙY CHỈNH NỘI DUNG Ở PHẦN <script> BÊN DƯỚI (CONFIG) ===== */
:root{--pink:#ff9fb5;--rose:#e0245e;--deep:#b0154a;--glass:rgba(255,255,255,.42);--line:rgba(255,255,255,.75)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--deep);overflow:hidden;
 background:conic-gradient(#ffc1d0 25%,#ffb3c6 0 50%,#ffc1d0 0 75%,#ffb3c6 0) 0 0/44px 44px;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px}
.screen.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:scale(.97)}}
.glass{background:var(--glass);border:1.5px solid var(--line);border-radius:28px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(224,36,94,.18)}
.ph{background:linear-gradient(135deg,#ffd6e0,#ff9fb5);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 
/* Khoá màn hình */
#lock .glass{display:flex;gap:28px;padding:26px;align-items:center;max-width:640px;width:100%}
#lock .ph{width:220px;aspect-ratio:9/16;border-radius:20px;border:3px solid #fff;flex:none}
.pad{flex:1;text-align:center}
.pad .heart{font-size:34px;color:var(--rose);animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.pad p{font-family:'Dancing Script',cursive;font-size:20px;font-weight:700;margin:6px 0 14px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--rose)}
.dots i.f{background:var(--rose)}
.keys{display:grid;grid-template-columns:repeat(3,54px);gap:10px;justify-content:center}
.keys button{height:54px;border:0;border-radius:50%;background:rgba(255,255,255,.55);color:var(--deep);font:700 20px Quicksand,sans-serif;cursor:pointer;transition:.15s}
.keys button:active{background:#fff;transform:scale(.92)}
.keys .z{grid-column:2}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media(max-width:560px){#lock .glass{flex-direction:column;gap:14px;padding:18px}#lock .ph{width:120px}}
 
/* Màn hình chính */
#home .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(440px,100%)}
.tile{aspect-ratio:1.5;border:1.5px solid var(--line);border-radius:22px;background:rgba(255,255,255,.4);backdrop-filter:blur(10px);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 15px Quicksand,sans-serif;color:var(--deep);cursor:pointer;transition:.2s}
.tile span{font-size:40px}
.tile:hover,.tile:focus-visible{background:#fff;transform:translateY(-3px)}
 
/* Cửa sổ */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(120,50,70,.35);backdrop-filter:blur(4px);z-index:10}
.modal.on{display:flex;animation:fade .3s}
.win{position:relative;width:min(400px,100%);max-height:88vh;overflow:auto;padding:22px;background:rgba(255,235,240,.82)}
.x{position:absolute;top:12px;right:12px;width:28px;height:28px;border:0;border-radius:50%;background:var(--rose);color:#fff;font-size:16px;cursor:pointer;z-index:2}
.win h2{font-size:12px;text-align:center;margin-bottom:12px}
 
/* Nhạc */
.cover{width:150px;height:150px;border-radius:18px;margin:0 auto 12px;border:3px solid #fff}
.title{text-align:center;font-weight:700;font-size:17px}
.bar{height:5px;background:rgba(224,36,94,.2);border-radius:5px;margin:12px 0;cursor:pointer}
.bar div{height:100%;width:0;background:var(--rose);border-radius:5px}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin-bottom:12px}
.ctl button{border:0;background:none;color:var(--rose);font-size:20px;cursor:pointer}
.ctl #play{width:48px;height:48px;border-radius:50%;background:var(--rose);color:#fff}
.song{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.song.on{background:rgba(224,36,94,.15)}
.song .ph{width:34px;height:34px;border-radius:8px;font-size:16px;flex:none}
 
/* Thư */
.letter{font-family:'Dancing Script',cursive;font-size:22px;font-weight:500;line-height:1.55;min-height:300px;white-space:pre-wrap;padding:6px 4px}
.to{font-size:14px;opacity:.7;font-weight:700}
 
/* Ảnh */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .ph{aspect-ratio:3/4;border-radius:10px;border:2px solid #fff;cursor:pointer}
.big{width:min(420px,92vw);max-height:80vh;position:relative}
.big .ph{aspect-ratio:3/4;border-radius:16px;border:4px solid #fff;font-size:60px}
 
/* Quà */
#gift{background:#06120f;padding:0;z-index:5}
#gift canvas{width:100%;height:100%;display:block}
#gift .x{top:calc(14px + env(safe-area-inset-top))}
.msg{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:rgba(255,236,240,.92);color:var(--deep);padding:8px 16px;border-radius:16px;font:700 14px Quicksand,sans-serif;white-space:nowrap;animation:up 6s forwards;pointer-events:none}
@keyframes up{to{transform:translate(-50%,-38vh);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
 
<!-- KHOÁ -->
<section class="screen on" id="lock">
  <div class="glass">
    <div class="ph" id="lockPhoto">💑</div>
    <div class="pad">
      <div class="heart">♥</div>
      <p id="hint"></p>
      <div class="dots" id="dots"></div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</section>
 
<!-- MÀN HÌNH CHÍNH -->
<section class="screen" id="home">
  <div class="grid">
    <button class="tile" data-open="music"><span>🎵</span>Music</button>
    <button class="tile" data-open="letter"><span>💌</span>Letter</button>
    <button class="tile" data-open="image"><span>🖼️</span>Image</button>
    <button class="tile" data-open="gift"><span>🎁</span>Gift</button>
  </div>
</section>
 
<!-- NHẠC -->
<div class="modal" id="music"><div class="win glass">
  <button class="x" data-close>×</button><h2>♫ MUSIC PLAYER</h2>
  <div class="ph cover" id="cover">🎶</div>
  <div class="title" id="songName"></div>
  <div class="bar" id="bar"><div></div></div>
  <div class="ctl"><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button></div>
  <div id="list"></div>
</div></div>
 
<!-- THƯ -->
<div class="modal" id="letter"><div class="win glass">
  <button class="x" data-close>×</button>
  <div class="to" id="to"></div><div class="letter" id="text"></div>
</div></div>
 
<!-- ẢNH -->
<div class="modal" id="image"><div class="win glass">
  <button class="x" data-close>×</button><h2 id="galTitle"></h2><div class="gal" id="gal"></div>
</div></div>
<div class="modal" id="lightbox"><div class="big"><button class="x" data-close>×</button><div class="ph" id="bigPh"></div></div></div>
 
<!-- QUÀ -->
<section class="screen" id="gift"><button class="x" id="giftX">×</button><canvas id="cv"></canvas></section>
 
<script>
/* ================= CONFIG: SỬA Ở ĐÂY ================= */
const CONFIG = {
  password: "2304",                          // 4 số, ví dụ ngày sinh (ddmm)
  hint: "Mật khẩu là ngày mình gặp nhau trên chiếc xe dream Tháii",
  lockPhoto: "1.jpg",              // ảnh bên trái màn hình khoá
  galleryTitle: "TRUNG THU ẤM ÁP BÌNH AN",
  photos: ["1.jpg","2.jpg","3.jpg","4.jpg","10.jpg","12.jpg"],
songs: [
      {title: "Hoa Cau Vườn Trầu", src: "Hoa Cau Vườn Trầu.mp3", cover: "13.jpg"},
      {title: "Mình yêu nhau đi", src: "Mình yêu nhau đi.mp3", cover: "9.jpg"},
      {title: "Đến khi nào", src: "Đến khi nào (Chill Out).mp3", cover: "11.jpg"}
    ],

  letterTo: "Gửi anh,",
  letter: "Người ta bảo rằm tháng Tám ngắm trăng ngắm sao, còn em chỉ muốn ngắm mỗi anh thôi. Chúc 'chú Cuội' của em một mùa đoàn viên hạnh phúc, lúc nào cũng rạng rỡ như trăng rằm\n\nMong chúng mình sẽ cùng nhau đón thêm nhiều mùa trăng nữa. Trăng rằm hôm nay rất đẹp, nhưng trong mắt em, anh mới là điều sáng nhất.\n\nChúc anh yêu mùa Trung Thu tròn đầy hạnh phúc nhé ♥\n\n Hue Rose xinh gái, cute, đáng iu ơi là iuuuuu ♥",
  wishes: ["Chúc anh Trung Thu ngập tràn niềm vui","Trăng sáng, và anh còn sáng hơn","Em yêu anh ♥","Mùa trăng nào cũng muốn có anh","Ăn bánh nhớ nghĩ đến em nhé", "Anh ngon lắm"]
};
/* ===================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function fill(el,src,fallback){ // đặt ảnh; nếu không có file thì giữ nền hồng + emoji
  if(fallback) el.textContent=fallback;
  const i=new Image(); i.onload=()=>el.appendChild(i); i.src=src; i.alt="";
}
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
 
/* Khoá */
let pin=""; $('#hint').textContent=CONFIG.hint; fill($('#lockPhoto'),CONFIG.lockPhoto,'💑');
const dots=$('#dots'); for(let i=0;i<CONFIG.password.length;i++) dots.append(document.createElement('i'));
const keys=$('#keys');
[1,2,3,4,5,6,7,8,9,0,'⌫'].forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.setAttribute('aria-label',k==='⌫'?'Xoá':k);
  if(k===0) b.className='z'; b.onclick=()=>press(k); keys.append(b);
});
function press(k){
  pin = k==='⌫' ? pin.slice(0,-1) : (pin.length<CONFIG.password.length ? pin+k : pin);
  [...dots.children].forEach((d,i)=>d.classList.toggle('f',i<pin.length));
  if(pin.length===CONFIG.password.length){
    if(pin===CONFIG.password) setTimeout(()=>show('home'),250);
    else{const g=$('#lock .glass');g.classList.add('shake');setTimeout(()=>{g.classList.remove('shake');pin="";press('⌫')},450)}
  }
}
addEventListener('keydown',e=>{if($('#lock').classList.contains('on')){if(/^\d$/.test(e.key))press(+e.key);if(e.key==='Backspace')press('⌫')}});
 
/* Mở/đóng cửa sổ */
let typing;
$$('[data-open]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.open;
  if(id==='gift'){show('gift');startGift();return}
  $('#'+id).classList.add('on'); if(id==='letter')typeLetter();
});
$$('[data-close]').forEach(b=>b.onclick=()=>{
  const m=b.closest('.modal'); m.classList.remove('on'); clearInterval(typing);
});
$('#giftX').onclick=()=>{stopGift();show('home')};
 
/* Nhạc */
const au=new Audio(); let cur=0;
CONFIG.songs.forEach((s,i)=>{
  const r=document.createElement('div'); r.className='song';
  r.innerHTML='<div class="ph">🎵</div><span>'+s.title+'</span>'; fill(r.firstChild,s.cover);
  r.onclick=()=>load(i,true); $('#list').append(r);
});
function load(i,play){
  cur=(i+CONFIG.songs.length)%CONFIG.songs.length; const s=CONFIG.songs[cur];
  au.src=s.src; $('#songName').textContent=s.title; fill($('#cover'),s.cover,'🎶');
  $$('.song').forEach((e,j)=>e.classList.toggle('on',j===cur));
  if(play) au.play().catch(()=>{}); 
}
$('#play').onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
$('#prev').onclick=()=>load(cur-1,true); $('#next').onclick=()=>load(cur+1,true);
au.onplay=()=>$('#play').textContent='⏸'; au.onpause=()=>$('#play').textContent='▶';
au.onended=()=>load(cur+1,true);
au.ontimeupdate=()=>$('#bar div').style.width=(au.currentTime/au.duration*100||0)+'%';
$('#bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(au.duration)au.currentTime=(e.clientX-r.left)/r.width*au.duration};
load(0,false);
 
/* Thư (hiệu ứng gõ chữ) */
function typeLetter(){
  $('#to').textContent=CONFIG.letterTo; const t=$('#text'); t.textContent=""; let i=0;
  typing=setInterval(()=>{t.textContent=CONFIG.letter.slice(0,++i); if(i>=CONFIG.letter.length)clearInterval(typing)},45);
}
 
/* Ảnh */
$('#galTitle').textContent=CONFIG.galleryTitle;
CONFIG.photos.forEach(p=>{
  const d=document.createElement('div'); d.className='ph'; d.textContent='🌙'; fill(d,p,'🌙');
  d.onclick=()=>{const b=$('#bigPh'); b.textContent='🌙'; b.querySelector('img')?.remove(); fill(b,p,'🌙'); $('#lightbox').classList.add('on')};
  $('#gal').append(d);
});
 
/* Quà: vườn hoa + lời chúc bay lên */
let raf, wishTimer;
function startGift(){
  const cv=$('#cv'), c=cv.getContext('2d'), dpr=devicePixelRatio||1;
  const W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  const flowers=[[.5,.62],[.36,.5],[.64,.5]].map(([x,h],i)=>({x:x*W,h:h*H,d:i*.6,lean:(x-.5)*W*.12}));
  const blades=Array.from({length:46},()=>({x:Math.random()*W,h:(.12+Math.random()*.22)*H,p:Math.random()*6}));
  const sparks=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,v:.2+Math.random()*.6,r:1+Math.random()*2}));
  const t0=performance.now();
  (function draw(now){
    const t=(now-t0)/1000; c.fillStyle='#06120f'; c.fillRect(0,0,W,H);
    const g=c.createRadialGradient(W/2,H*.35,0,W/2,H*.35,H*.6); g.addColorStop(0,'rgba(255,120,170,.12)'); g.addColorStop(1,'transparent'); c.fillStyle=g; c.fillRect(0,0,W,H);
    sparks.forEach(s=>{s.y-=s.v*dpr; if(s.y<0)s.y=H; c.fillStyle='rgba(255,190,210,.6)'; c.beginPath(); c.arc(s.x,s.y,s.r*dpr,0,7); c.fill()});
    const base=H;
    blades.forEach(b=>{const gr=Math.min(1,t/2), sw=Math.sin(t*1.4+b.p)*14*dpr; c.strokeStyle='#1f7a45'; c.lineWidth=7*dpr; c.lineCap='round';
      c.beginPath(); c.moveTo(b.x,base); c.quadraticCurveTo(b.x,base-b.h*gr*.6,b.x+sw,base-b.h*gr); c.stroke()});
    flowers.forEach(f=>{
      const p=Math.max(0,Math.min(1,(t-f.d)/2.4)), e=1-Math.pow(1-p,3), sw=Math.sin(t+f.d)*8*dpr;
      const tx=f.x+f.lean+sw, ty=base-f.h*e;
      c.strokeStyle='#2fa05a'; c.lineWidth=6*dpr; c.beginPath(); c.moveTo(f.x,base); c.quadraticCurveTo(f.x,base-f.h*e*.6,tx,ty); c.stroke();
      const bloom=Math.max(0,Math.min(1,(p-.8)/.2)); if(!bloom)return;
      const R=42*dpr*bloom; c.save(); c.translate(tx,ty);
      for(let k=0;k<6;k++){c.rotate(Math.PI/3); c.fillStyle=k%2?'#ff7fa8':'#ff5c93'; c.beginPath(); c.ellipse(0,-R*.75,R*.42,R*.85,0,0,7); c.fill()}
      c.fillStyle='#ffd1e0'; c.beginPath(); c.arc(0,0,R*.32,0,7); c.fill(); c.restore();
    });
    raf=requestAnimationFrame(draw);
  })(t0);
  let n=0; setTimeout(()=>{wishTimer=setInterval(()=>{
    const m=document.createElement('div'); m.className='msg'; m.textContent=CONFIG.wishes[n++%CONFIG.wishes.length];
    m.style.left=(25+Math.random()*50)+'%'; $('#gift').append(m); setTimeout(()=>m.remove(),6000);
  },1800)},3000);
}
function stopGift(){cancelAnimationFrame(raf);clearInterval(wishTimer);$$('.msg').forEach(m=>m.remove())}
</script>
</body>
</html>
